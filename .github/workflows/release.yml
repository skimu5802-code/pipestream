name: Build and Release Production APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # প্রোডাকশন Release Keystore তৈরি করা
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -storepass "pipestreampassword" \
            -alias "pipestream" \
            -keypass "pipestreampassword" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PipeStream,OU=App,O=PipeStream,C=US"

      # Release APK বিল্ড করা
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      # তৈরি হওয়া আনসাইনড/রিলিজ এপিকে সাইন ও অ্যালাইন করা
      - name: Sign Release APK
        uses: ralfirza/action-release-android-apk@v1.1.2
        with:
          apkPath: app/build/outputs/apk/release/app-release-unsigned.apk
          releaseKeystore: release.keystore
          keyStorePassword: "pipestreampassword"
          keyAlias: "pipestream"
          keyPassword: "pipestreampassword"
        continue-on-error: true

      # যদি gradle সরাসরি সাইনড এপিকে তৈরি করে থাকে তা রিনেম করা
      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/PipeStream-Release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/PipeStream-Release.apk
          fi

      # GitHub Releases-এ ফাইনাল Release APK আপলোড করা
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/PipeStream-Release.apk
          generate_release_notes: true
          name: PipeStream Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}