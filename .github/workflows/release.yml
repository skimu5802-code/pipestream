name: Build and Release Production APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # স্থায়ী রিলিজ কি-স্টোর সেটআপ (Base64 ডিকোড করে কি-স্টোর প্রস্তুত করা)
      - name: Setup Permanent Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          elif [ -f "my-upload-key.base64" ]; then
            echo "Decoding permanent keystore from repository base64 file..."
            base64 -d my-upload-key.base64 > my-upload-key.jks
          else
            echo "Using embedded permanent release keystore..."
            cat << 'EOF' | base64 -d > my-upload-key.jks

EOF
          fi
          # কি-স্টোরের ফিঙ্গারপ্রিন্ট ভেরিফাই করা
          keytool -list -v -keystore my-upload-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD || 'android' }}" -alias "${{ secrets.KEY_ALIAS || 'upload' }}"

      # পাসওয়ার্ড ও কি-প্যারামিটার সহ Release APK বিল্ড করা
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/my-upload-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD || 'android' }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS || 'upload' }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD || 'android' }}"

      # তৈরি হওয়া Release APK প্রস্তুত করা
      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found release APK: $APK_FILE"
          cp "$APK_FILE" release-artifacts/PipeStream-Release.apk

      # GitHub Releases-এ ফাইনাল Production APK আপলোড করা
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/PipeStream-Release.apk
          generate_release_notes: true
          name: PipeStream Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}