name: Build and Release Production APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # নিরাপদ উপায়ে GitHub Secrets থেকে রিলিজ কি-স্টোর লোড করা
      - name: Setup Release Keystore from GitHub Secrets
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::GitHub Secret 'RELEASE_KEYSTORE_BASE64' not found! Please set up RELEASE_KEYSTORE_BASE64 in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"
          if [ ! -s "${{ runner.temp }}/release.keystore" ]; then
            echo "::error::Failed to decode release.keystore from secret."
            exit 1
          fi
          echo "Keystore successfully prepared."

      # পাসওয়ার্ড ও কি-প্যারামিটার সহ Production Release APK বিল্ড করা
      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${{ runner.temp }}/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # সিকিউরিটির জন্য কি-স্টোর ফাইল রানার থেকে মুছে ফেলা
      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release.keystore"

      # তৈরি হওয়া Release APK প্রস্তুত করা
      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found release APK: $APK_FILE"
          cp "$APK_FILE" release-artifacts/PipeStream-Release.apk

      # GitHub Releases-এ ফাইনাল Production APK আপলোড করা
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/PipeStream-Release.apk
          generate_release_notes: true
          name: PipeStream Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}