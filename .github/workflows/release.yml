name: Build and Release Production APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Gradle-এর প্রত্যাশিত my-upload-key.jks কি-স্টোর ফাইলটি তৈরি করা
      - name: Generate JKS Keystore for Gradle
        run: |
          keytool -genkey -v \
            -keystore my-upload-key.jks \
            -storepass "android" \
            -alias "upload" \
            -keypass "android" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PipeStream,OU=App,O=PipeStream,C=US"

      # Release APK বিল্ড করা
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      # তৈরি হওয়া Release APK সাজানো
      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found release APK: $APK_FILE"
          cp "$APK_FILE" release-artifacts/PipeStream-Release.apk

      # GitHub Releases-এ ফাইনাল Production APK আপলোড করা
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/PipeStream-Release.apk
          generate_release_notes: true
          name: PipeStream Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}