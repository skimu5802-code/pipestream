name: Build and Release Production APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # প্রোডাকশন রিলিজ কি-স্টোর তৈরি করা
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -storepass "pipestreampassword" \
            -alias "pipestream" \
            -keypass "pipestreampassword" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PipeStream,OU=App,O=PipeStream,C=US"

      # Release APK বিল্ড করা
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      # অফিসিয়াল Android apksigner ও zipalign দিয়ে APK সাইন করা
      - name: Sign & Align Release APK
        run: |
          mkdir -p release-artifacts
          
          # বিল্ড হওয়া APK খুঁজে বের করা
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          
          # লেটেস্ট বিল্ড টুলস ডিরেক্টরি বের করা
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          
          # Zipalign এবং সাইন সম্পন্ন করা
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_FILE" release-artifacts/PipeStream-aligned.apk
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-key-alias pipestream \
            --ks-pass pass:pipestreampassword \
            --key-pass pass:pipestreampassword \
            --out release-artifacts/PipeStream-Release.apk \
            release-artifacts/PipeStream-aligned.apk
            
          # সাইনিং ভেরিফিকেশন চেক
          $BUILD_TOOLS_DIR/apksigner verify release-artifacts/PipeStream-Release.apk
          echo "APK successfully signed and verified!"

      # GitHub Releases-এ ফাইনাল Production APK আপলোড করা
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/PipeStream-Release.apk
          generate_release_notes: true
          name: PipeStream Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}